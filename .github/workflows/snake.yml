name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f472b6&color_dots=#ebedf0,#fbcfe8,#f9a8d4,#e879f9,#c084fc
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7ab8&color_dots=#161b22,#4c1d95,#7e22ce,#c084fc,#f9a8d4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
